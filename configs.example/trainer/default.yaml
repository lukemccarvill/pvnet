_target_: lightning.Trainer

# set `gpu` to train on GPU, `cpu` to train on CPU only

# accelerator: auto
# devices: auto
accelerator: cpu #Luke
devices: 1 #Luke

# min_epochs: null
# max_epochs: null
min_epochs: 1 #Luke
max_epochs: 1 #Luke

reload_dataloaders_every_n_epochs: 0

# num_sanity_val_steps: 8 
num_sanity_val_steps: 0 #Luke

fast_dev_run: false

# accumulate_grad_batches: 4
accumulate_grad_batches: 1 #Luke

# log_every_n_steps: 50
log_every_n_steps: 5 #Luke

# --- new params, that were not here before? Luke:

limit_train_batches: 10
limit_val_batches: 2